# Log-based alert rules for Grafana Cloud Loki (12-observability §6, ADR-0040).
# Import: Grafana Cloud > Alerting > Alert rules > "Import" (Loki data source), or
#   mimirtool rules load --backend=loki infra/alloy/alerts.loki.yaml   (see docs/OPS_SETUP.md)
namespace: lga
groups:
  - name: lga-backups
    interval: 5m
    rules:
      - alert: BackupMissing
        expr: absent_over_time({env="production", service="backup", event="backup.succeeded"}[26h])
        labels: { severity: critical }
        annotations:
          summary: No successful database backup in the last 26 hours.
          runbook: infra/runbooks/restore.md#backup-alerts
      - alert: BackupFailed
        expr: sum(count_over_time({env="production", service="backup", event="backup.failed"}[1h])) > 0
        labels: { severity: critical }
        annotations:
          summary: The nightly backup job reported a failure.
          runbook: infra/runbooks/restore.md#backup-alerts

  - name: lga-errors
    interval: 1m
    rules:
      - alert: ErrorLogSpike
        expr: sum by (service) (count_over_time({env="production", level=~"error|fatal"}[10m])) > 20
        for: 5m
        labels: { severity: high }
        annotations:
          summary: '{{ $labels.service }} logged more than 20 errors in 10 minutes.'
          runbook: infra/runbooks/incident-quickref.md#error-spike
