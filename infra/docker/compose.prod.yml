# Production-like stack: nginx + web + api + worker + migrate + postgres + valkey.
# Same file on the VPS (ADR-0012). Locally: pnpm stack:build && pnpm stack:up && pnpm stack:smoke
# Only nginx publishes a port. PostgreSQL and Valkey are reachable on the private network only.
name: lga

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '3'

x-hardening: &hardening
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  logging: *logging

x-backend-env: &backend-env
  NODE_ENV: production
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PRETTY: 'false'
  RELEASE: ${RELEASE:-dev}
  APP_ORIGIN: ${STACK_APP_ORIGIN:-http://localhost:8080}
  INTEGRATIONS_MODE: ${INTEGRATIONS_MODE:-fake}
  DATABASE_URL: postgresql://${POSTGRES_APP_USER:-lga_app}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-lga}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0

services:
  nginx:
    image: nginx:stable-alpine
    <<: *hardening
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: '1'
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources: { limits: { memory: 128m } }

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      target: runtime
    image: lga-web:${RELEASE:-dev}
    <<: *hardening
    environment:
      INTERNAL_API_URL: http://api:4000
      APP_ORIGIN: ${STACK_APP_ORIGIN:-http://localhost:8080}
      APP_ENV: ${APP_ENV:-local}
      RELEASE: ${RELEASE:-dev}
      NODE_OPTIONS: --max-old-space-size=512
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources: { limits: { memory: 768m } }

  api:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      target: runtime
      args: { APP: api }
    image: lga-api:${RELEASE:-dev}
    <<: *hardening
    environment:
      <<: *backend-env
      API_PORT: '4000'
      API_HOST: 0.0.0.0
      TRUST_PROXY: loopback, linklocal, uniquelocal
      SESSION_PEPPER: ${SESSION_PEPPER:?set SESSION_PEPPER in .env (pnpm run setup --update)}
      EMAIL_HASH_PEPPER: ${EMAIL_HASH_PEPPER:?set EMAIL_HASH_PEPPER in .env (pnpm run setup --update)}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NODE_OPTIONS: --max-old-space-size=512
    tmpfs: [/tmp]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health/ready']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources: { limits: { memory: 768m } }

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      target: runtime
      args: { APP: worker }
    image: lga-worker:${RELEASE:-dev}
    <<: *hardening
    environment:
      <<: *backend-env
      WORKER_HEALTH_PORT: '4100'
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_CONCURRENCY_FACTOR: ${WORKER_CONCURRENCY_FACTOR:-1}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-60000}
      # System email relay. Unset in the local stack = emails are only logged.
      SMTP_URL: ${STACK_SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Lead Generation Agent <no-reply@localhost>}
      NODE_OPTIONS: --max-old-space-size=1024
    tmpfs: [/tmp]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4100/health/ready']
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s
    deploy:
      resources: { limits: { memory: 1536m } }

  # Applies migrations as the schema owner, then exits. api/worker wait for it.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      target: migrate
      args: { APP: api }
    image: lga-migrate:${RELEASE:-dev}
    restart: 'no'
    environment:
      DATABASE_MIGRATOR_URL: postgresql://${POSTGRES_USER:-lga_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lga}
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lga}
      POSTGRES_USER: ${POSTGRES_USER:-lga_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-lga_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=60
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500ms
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    deploy:
      resources: { limits: { memory: 3g } }

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory 384mb --maxmemory-policy noeviction
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    deploy:
      resources: { limits: { memory: 512m } }

volumes:
  pgdata:
  valkeydata:
