# Edge proxy for the Docker stack (docs/ARCHITECTURE.md §17.3).
# Sites live in site.http.conf (local) and site.tls.conf.template (VPS, compose.vps.yml).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/lga/http-common.conf;
  # One site file: site.http.conf locally, or the TLS site rendered from
  # site.tls.conf.template on the VPS (compose.vps.yml).
  include /etc/nginx/site/site.conf;
}
