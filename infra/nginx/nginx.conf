# Edge proxy for the Docker stack (docs/ARCHITECTURE.md §17.3).
# HTTP only. For production TLS see tls.conf.example in this directory.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # JSON access log. $uri (not $request_uri) so query strings (tokens) are never logged.
  log_format json escape=json '{"ts":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"upstream":"$upstream_addr","ua":"$http_user_agent"}';
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/problem+json application/javascript text/css text/plain image/svg+xml;

  # Rate limits per client IP (03-api.md §8). Fine-grained limits live in the API.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=public:10m rate=1r/s;
  limit_req_status 429;

  # Behind Cloudflare (optional): trust CF-Connecting-IP only from Cloudflare ranges.
  # include /etc/nginx/cloudflare-realip.conf;

  upstream web {
    server web:3000;
    keepalive 16;
  }
  upstream api {
    server api:4000;
    keepalive 16;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options DENY always;

    proxy_http_version 1.1;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Our own request id. Client-supplied ids are never trusted.
    proxy_set_header X-Request-Id $request_id;
    proxy_hide_header X-Request-Id;
    add_header X-Request-Id $request_id always;
    proxy_read_timeout 60s;

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/v1/auth/ {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass http://api;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api;
    }

    # Public API endpoints: health (uptime monitors), webhooks, unsubscribe.
    location /health/ {
      proxy_pass http://api;
    }
    location /webhooks/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api;
    }
    location /u/ {
      limit_req zone=public burst=60 nodelay;
      proxy_pass http://api;
    }

    # Operational UIs are never exposed through the public edge.
    location /admin/queues {
      return 404;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
