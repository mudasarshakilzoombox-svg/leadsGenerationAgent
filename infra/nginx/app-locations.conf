# Headers and routes of the app server (docs/ARCHITECTURE.md §17.3), shared by the local HTTP
# site and the VPS TLS site so the two can never drift.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options DENY always;

proxy_http_version 1.1;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Our own request id. Client-supplied ids are never trusted.
proxy_set_header X-Request-Id $request_id;
proxy_hide_header X-Request-Id;
add_header X-Request-Id $request_id always;
proxy_read_timeout 60s;

location = /nginx-health {
  access_log off;
  add_header Content-Type text/plain;
  return 200 "ok\n";
}

location /api/v1/auth/ {
  limit_req zone=auth burst=20 nodelay;
  proxy_pass http://api;
}

location /api/ {
  limit_req zone=api burst=40 nodelay;
  proxy_pass http://api;
}

# Public API endpoints: health (uptime monitors), webhooks, unsubscribe.
location /health/ {
  proxy_pass http://api;
}
location /webhooks/ {
  limit_req zone=api burst=40 nodelay;
  proxy_pass http://api;
}
location /u/ {
  limit_req zone=public burst=60 nodelay;
  proxy_pass http://api;
}

# Operational UIs are never exposed through the public edge.
location /admin/queues {
  return 404;
}

location / {
  proxy_pass http://web;
}
