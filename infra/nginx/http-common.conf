# Shared http-level settings (logging, compression, rate limits, upstreams).
# Included by nginx.conf for both the local HTTP site and the VPS TLS site (ADR-0040).
include /etc/nginx/mime.types;
default_type application/octet-stream;
server_tokens off;

client_body_temp_path /tmp/client_body;
proxy_temp_path /tmp/proxy;
fastcgi_temp_path /tmp/fastcgi;
uwsgi_temp_path /tmp/uwsgi;
scgi_temp_path /tmp/scgi;

# JSON access log. $uri (not $request_uri) so query strings (tokens) are never logged.
log_format json escape=json '{"ts":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
  '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration":$request_time,"upstream":"$upstream_addr","ua":"$http_user_agent"}';
access_log /dev/stdout json;

sendfile on;
tcp_nopush on;
keepalive_timeout 65;
client_max_body_size 20m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/problem+json application/javascript text/css text/plain image/svg+xml;

# Rate limits per client IP (03-api.md §8). Fine-grained limits live in the API.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=public:10m rate=1r/s;
limit_req_status 429;

# Behind Cloudflare (optional): trust CF-Connecting-IP only from Cloudflare ranges.
# include /etc/nginx/cloudflare-realip.conf;

upstream web {
  server web:3000;
  keepalive 16;
}
upstream api {
  server api:4000;
  keepalive 16;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}
