# AI routing (05-ai-orchestration §7, ADR-0031, ADR-0037). Model ids live here, never in code.
# Change a tier or a prompt version here and redeploy: no code change (rollback = config change).
#
# Each tier lists providers in fallback order. Only allowlisted models run (AIC-CALL-04): any model
# a task resolves to must appear here. The OpenAI fallback is left out until the Gate 1 provider
# eval picks a model; add e.g. `- { provider: openai, model: <id> }` under a tier to enable it.
#
# serverFallback: enable Anthropic's server-side refusal fallback for that model (beta). Not
# available on Haiku models.
version: 1

tiers:
  fast:
    - { provider: anthropic, model: claude-haiku-5-5, rpm: 200 }
  standard:
    - { provider: anthropic, model: claude-sonnet-5-5, rpm: 100, serverFallback: true }
  advanced:
    - { provider: anthropic, model: claude-opus-5-5, rpm: 50, serverFallback: true }

# Per-task overrides. A task not listed uses its catalog defaults (tasks.ts) and prompt version 1.
tasks:
  system.selftest:
    promptVersion: 1
    disabled: false
