# AI routing (05-ai-orchestration §7, ADR-0031, ADR-0037). Model ids live here, never in code.
# Change a tier or a prompt version here and redeploy: no code change (rollback = config change).
#
# Each tier lists providers in fallback order. Only allowlisted models run (AIC-CALL-04): any model
# a task resolves to must appear here, and every model needs a price in ai-pricing.yaml.
#
# Provider: OpenAI (owner decision 2026-11-27). The Anthropic adapter stays available: to add it
# as a fallback, list e.g. `- { provider: anthropic, model: claude-sonnet-5-5 }` after the OpenAI
# entry of a tier and set ANTHROPIC_API_KEY.
#
# reasoning: true (default) = reasoning model: the adapter sends reasoning_effort and no
#   temperature. Set false for a non-reasoning model.
# rpm: requests per minute for this model, shared across processes (keep under the account limit).
version: 1

tiers:
  # Classification, research extraction, self-test: cheapest model.
  fast:
    - { provider: openai, model: gpt-6-luna, rpm: 200 }
  # Website extraction, drafts, suggested replies.
  standard:
    - { provider: openai, model: gpt-6.2-sol, rpm: 100 }
  # ICP generation. Raise to gpt-6.2-astra only if the eval shows a quality gain worth 4x the cost.
  advanced:
    - { provider: openai, model: gpt-6.2-sol, rpm: 50 }

# Per-task overrides. A task not listed uses its catalog defaults (tasks.ts) and prompt version 1.
tasks:
  system.selftest:
    promptVersion: 1
    disabled: false
