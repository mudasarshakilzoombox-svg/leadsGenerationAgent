name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lga
          POSTGRES_USER: lga_owner
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lga_owner -d lga"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      APP_ENV: test
      NODE_ENV: test
      LOG_LEVEL: warn
      APP_ORIGIN: http://localhost:3300
      # CI uses the owner role for both app and migrations (no init script on service containers).
      DATABASE_URL: postgresql://lga_owner:ci-only-password@localhost:5432/lga
      DATABASE_MIGRATOR_URL: postgresql://lga_owner:ci-only-password@localhost:5432/lga
      VALKEY_URL: redis://localhost:6379/0
      SESSION_PEPPER: ci-only-session-pepper-not-a-secret-0001
      EMAIL_HASH_PEPPER: ci-only-email-pepper-not-a-secret-00001
      # CI-only key rings (all-zero / all-one bytes); never used outside tests.
      APP_ENCRYPTION_KEYS: '{"1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      APP_ENCRYPTION_ACTIVE_VERSION: '1'
      UNSUBSCRIBE_TOKEN_KEYS: '{"1":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="}'
      UNSUBSCRIBE_TOKEN_ACTIVE_KEY_ID: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high --prod

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, file: infra/docker/web.Dockerfile, target: runtime, app: '' }
          - { name: api, file: infra/docker/backend.Dockerfile, target: runtime, app: api }
          - { name: worker, file: infra/docker/backend.Dockerfile, target: runtime, app: worker }
          - { name: migrate, file: infra/docker/backend.Dockerfile, target: migrate, app: api }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.app && format('APP={0}', matrix.app) || '' }}
          push: false
          tags: lga-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
